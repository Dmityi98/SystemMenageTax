services:
  smt.api:
    image: smt.api
    build:
      context: .
      dockerfile: SMT.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=SMTDb;Username=postgres;Password=${DB_PASSWORD:-admin}
      - DbConnection=Host=db;Port=5432;Database=SMTDb;Username=postgres;Password=${DB_PASSWORD:-admin}
      - JwtOptions__SecretKey=${JWT_SECRET:-CHANGE_THIS_SECRET_KEY_TO_A_SECURE_64_CHAR_STRING}
      - JwtOptions__Issuer=SMTAPI
      - JwtOptions__Audience=SMTClient
      - JwtOptions__ExpiresHours=12
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smt-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=SMTDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - smt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  smt-network:
    driver: bridge

volumes:
  postgres_data:

